<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unang Blockchain ni Mayor Rjay</title>
        <link rel="stylesheet" href="./CSS/sim.css">
    </head>
    <body>
        <div>
            <h1>Ang Unang Blockchain Ni Mayor Rjay</h1>
            <p id="welcome-message">Welcome to the Blockchain Simulator!</p>

            <section class="controls">
                <input type="text" id="block-data" placeholder="Enter block data">
                <button id="addblockbtn">add block</button>
                <button id="validateBtn">Validate Chain</button>
            </section>

            <div id="chain" class="chain"></div>

            <section class="output">
                <h2>Chain status</h2>
                <div id="status" class="status valid">chain is valid</div>
            </section>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
        <script src="./JS/sim.js"></script>
    </body>
</html>
